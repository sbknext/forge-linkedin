[package]
name = "rate-limit"
version = "0.1.0"
description = "Daily rate limiter for forge-linkedin"
repository = "https://github.com/sbknext/forge-linkedin"
homepage = "https://forge.sbknext.com"
edition = "2021"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
chrono-tz = "0.9"
