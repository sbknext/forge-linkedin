[package]
name = "forge-linkedin"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sbknext/forge-linkedin"

[[bin]]
name = "forge-linkedin"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
linkedin-ops = { path = "../linkedin-ops" }
store = { path = "../store" }
rate-limit = { path = "../rate-limit" }
filter = { path = "../filter" }
jobs-ops = { path = "../jobs-ops" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
