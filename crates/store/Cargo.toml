[package]
name = "store"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
directories = "5"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
